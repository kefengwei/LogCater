name: Build and Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android platform-tools
        run: |
          curl -L -o platform-tools.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          7z x platform-tools.zip -oplatform-tools
        shell: cmd

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DADB_EXECUTABLE=${{ github.workspace }}\platform-tools\platform-tools\adb.exe"

      - name: Build
        run: cmake --build build --config Release

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Package installer (NSIS)
        working-directory: build
        run: cpack -C Release -G NSIS

      - name: Stage release package
        run: |
          mkdir stage
          copy build\Release\logcater.exe stage\
          xcopy /E /I build\Release\adb stage\adb
          copy build\LogCater-*.exe stage\
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: logcater
          path: stage\

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: logcater
          path: logcater

      - name: Package zip
        run: |
          cd logcater
          zip -r ../LogCater.zip logcater.exe adb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LogCater.zip
            logcater/LogCater-*.exe
          generate_release_notes: true
